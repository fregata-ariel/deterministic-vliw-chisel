name: Quarto manual

on:
  pull_request:
    paths:
      - docs/manual/**
      - docs/issue-78/**
      - config/machine*.json
      - tests/cases/**
      - tests/golden/**
      - .github/workflows/manual.yml
  push:
    branches: [main]
    paths:
      - docs/manual/**
      - docs/issue-78/**
      - config/machine*.json
      - tests/cases/**
      - tests/golden/**
      - .github/workflows/manual.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quarto-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manual:
    name: ${{ matrix.document }}
    strategy:
      fail-fast: false
      matrix:
        document: [manual, issue-78]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.8.27"
      - name: Install Japanese fonts and print inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk poppler-utils libreoffice-writer
      - name: Install a pinned browser for Quarto and tests
        run: |
          npm install --prefix "$RUNNER_TEMP/manual-browser" --no-package-lock playwright@1.56.1
          "$RUNNER_TEMP/manual-browser/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/manual-browser/node_modules" node -e 'console.log("QUARTO_CHROMIUM=" + require("playwright").chromium.executablePath())' >> "$GITHUB_ENV"
      - name: Check portable source and golden trace
        run: python3 docs/${{ matrix.document }}/tests/check_source.py
      - name: Render HTML PDF and DOCX with standard Quarto
        id: render
        timeout-minutes: 4
        run: quarto render docs/${{ matrix.document }} --to all
      - name: Check diagrams and all stages in print outputs
        run: python3 docs/${{ matrix.document }}/tests/check_outputs.py
      - name: Inspect PDF and DOCX page layouts
        if: ${{ !cancelled() && steps.render.outcome == 'success' }}
        run: |
          mkdir -p docs/${{ matrix.document }}/_output/qa/pdf docs/${{ matrix.document }}/_output/qa/docx
          pdftoppm -scale-to 1400 -png docs/${{ matrix.document }}/_output/index.pdf docs/${{ matrix.document }}/_output/qa/pdf/page
          libreoffice -env:UserInstallation=file:///$RUNNER_TEMP/manual-lo --headless --convert-to pdf --outdir docs/${{ matrix.document }}/_output/qa/docx docs/${{ matrix.document }}/_output/index.docx
          pdftoppm -scale-to 1400 -png docs/${{ matrix.document }}/_output/qa/docx/index.pdf docs/${{ matrix.document }}/_output/qa/docx/page
      - name: Check native Mermaid and standard tabs
        if: ${{ !cancelled() && steps.render.outcome == 'success' }}
        run: node docs/${{ matrix.document }}/tests/browser.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/manual-browser/node_modules
      - name: Keep all three outputs and review pages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quarto-${{ matrix.document }}
          path: docs/${{ matrix.document }}/_output/
          if-no-files-found: error
          retention-days: 14
