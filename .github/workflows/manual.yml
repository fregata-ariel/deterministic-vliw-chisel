name: Quarto manual

on:
  pull_request:
    paths:
      - docs/manual/**
      - config/machine*.json
      - tests/cases/**
      - tests/golden/**
      - .github/workflows/manual.yml
  push:
    branches: [main]
    paths:
      - docs/manual/**
      - config/machine*.json
      - tests/cases/**
      - tests/golden/**
      - .github/workflows/manual.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.8.27"
      - name: Install Japanese fonts and print inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk poppler-utils libreoffice-writer
      - name: Check portable source and golden trace
        run: python3 docs/manual/tests/check_source.py
      - name: Render HTML PDF and DOCX with standard Quarto
        run: quarto render docs/manual --to all
      - name: Check diagrams and all stages in print outputs
        run: python3 docs/manual/tests/check_outputs.py
      - name: Inspect PDF and DOCX page layouts
        run: |
          mkdir -p docs/manual/_output/qa/pdf docs/manual/_output/qa/docx
          pdftoppm -scale-to 1400 -png docs/manual/_output/index.pdf docs/manual/_output/qa/pdf/page
          libreoffice -env:UserInstallation=file:///$RUNNER_TEMP/manual-lo --headless --convert-to pdf --outdir docs/manual/_output/qa/docx docs/manual/_output/index.docx
          pdftoppm -scale-to 1400 -png docs/manual/_output/qa/docx/index.pdf docs/manual/_output/qa/docx/page
      - name: Install browser test tools outside the checkout
        run: |
          npm install --prefix "$RUNNER_TEMP/manual-browser" --no-package-lock playwright@1.56.1
          "$RUNNER_TEMP/manual-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check native Mermaid and standard tabs
        run: node docs/manual/tests/browser.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/manual-browser/node_modules
      - name: Keep all three outputs and review pages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quarto-manual
          path: docs/manual/_output/
          if-no-files-found: error
          retention-days: 14
