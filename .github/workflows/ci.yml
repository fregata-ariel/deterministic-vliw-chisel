name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install shellcheck if missing
        run: command -v shellcheck || (sudo apt-get update && sudo apt-get install -y shellcheck)
      - run: scripts/check.sh static

  scala:
    runs-on: ubuntu-24.04
    # A Verilator pinned to a commit is built here when the cache has none (200 to 370 s), not in a
    # job of its own: with `needs`, a failed build would skip this job, and a skipped required check
    # counts as passed.
    timeout-minutes: 30
    steps:
      # First: a local action can only run from the checkout.
      - uses: actions/checkout@v5
      # The JDK, sbt and Verilator of project/toolchain.properties (ADR-0020). No `with:`: the inputs
      # choose a candidate version, which the required check never runs with (scripts/check.sh static).
      - uses: ./.github/actions/setup-toolchain
      - run: scripts/check.sh scala
        # check.sh stops sbt itself after CHECK_TIMEOUT and records the failure. The step timeout is
        # only a backstop: it stops the outer shell and leaves sbt running. 960 s leaves room for
        # Verilator 5.052, whose sbt test takes about 1.24 times as long as 5.020's (#121,
        # docs/toolchain/5.052/report.md).
        env:
          CHECK_TIMEOUT: "960"
        timeout-minutes: 18
      # The required check runs with the pinned toolchain only (ADR-0020): each test JVM that
      # simulates prints a [toolchain] line, which shows (env) if VLIW_VERILATOR_EXPECTED changed
      # the expected Verilator. check.sh writes the sbt log to build/check-logs/<UTC time>/.
      - name: Check that the tests ran with the pinned toolchain
        run: |
          shopt -s nullglob
          logs=(build/check-logs/*/sbt.log)
          [[ ${#logs[@]} -eq 1 ]] || { echo "::error::expected one sbt.log, found ${#logs[@]}"; exit 1; }
          lines="$(sed 's/\x1b\[[0-9;]*[A-Za-z]//g' "${logs[0]}" | grep '^\[toolchain\] ' || true)"
          printf '%s\n' "$lines"
          [[ -n "$lines" ]] || { echo "::error::no [toolchain] line in ${logs[0]}"; exit 1; }
          if grep -v ' (pinned)$' <<<"$lines"; then
            echo '::error::a test JVM ran without the pinned toolchain (above)'
            exit 1
          fi
      # Traces an intermittent failure (#74): sbt log, environment, process samples, ChiselSim
      # directories (sources, Makefile, compilation-log.txt, seed.txt) and JUnit reports. The
      # Verilator output (C++ and object files) is left out to keep the artifact small.
      - name: Upload logs on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: scala-logs-attempt${{ github.run_attempt }}
          path: |
            build/check-logs/
            build/chiselsim/
            !build/chiselsim/**/verilated-sources/
            */target/test-reports/
          if-no-files-found: ignore
          retention-days: 14
