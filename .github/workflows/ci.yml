name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install shellcheck if missing
        run: command -v shellcheck || (sudo apt-get update && sudo apt-get install -y shellcheck)
      - run: scripts/check.sh static

  scala:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Install Verilator (ChiselSim backend)
        run: sudo apt-get update && sudo apt-get install -y verilator && verilator --version
      - run: scripts/check.sh scala
        # Shorter than the job, so that a hang still leaves time to upload the logs.
        timeout-minutes: 15
      # Traces an intermittent failure (#74): sbt log, environment, process samples, ChiselSim
      # directories (sources, Makefile, compilation-log.txt, seed.txt) and JUnit reports. The
      # Verilator output (C++ and object files) is left out to keep the artifact small.
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: scala-logs-attempt${{ github.run_attempt }}
          path: |
            build/check-logs/
            build/chiselsim/
            !build/chiselsim/**/verilated-sources/
            */target/test-reports/
          if-no-files-found: ignore
          retention-days: 14
