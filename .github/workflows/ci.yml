name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install shellcheck if missing
        run: command -v shellcheck || (sudo apt-get update && sudo apt-get install -y shellcheck)
      - run: scripts/check.sh static

  scala:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Install Verilator (ChiselSim backend)
        run: sudo apt-get update && sudo apt-get install -y verilator && verilator --version
      - run: scripts/check.sh scala
        # check.sh stops sbt itself after CHECK_TIMEOUT and records the failure. The step timeout is
        # only a backstop: it stops the outer shell and leaves sbt running.
        env:
          CHECK_TIMEOUT: "780"
        timeout-minutes: 15
      # The required check runs with the pinned toolchain only (ADR-0020): each test JVM that
      # simulates prints a [toolchain] line, which shows (env) if VLIW_VERILATOR_EXPECTED changed
      # the expected Verilator. check.sh writes the sbt log to build/check-logs/<UTC time>/.
      - name: Check that the tests ran with the pinned toolchain
        run: |
          shopt -s nullglob
          logs=(build/check-logs/*/sbt.log)
          [[ ${#logs[@]} -eq 1 ]] || { echo "::error::expected one sbt.log, found ${#logs[@]}"; exit 1; }
          lines="$(sed 's/\x1b\[[0-9;]*[A-Za-z]//g' "${logs[0]}" | grep '^\[toolchain\] ' || true)"
          printf '%s\n' "$lines"
          [[ -n "$lines" ]] || { echo "::error::no [toolchain] line in ${logs[0]}"; exit 1; }
          if grep -v ' (pinned)$' <<<"$lines"; then
            echo '::error::a test JVM ran without the pinned toolchain (above)'
            exit 1
          fi
      # Traces an intermittent failure (#74): sbt log, environment, process samples, ChiselSim
      # directories (sources, Makefile, compilation-log.txt, seed.txt) and JUnit reports. The
      # Verilator output (C++ and object files) is left out to keep the artifact small.
      - name: Upload logs on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: scala-logs-attempt${{ github.run_attempt }}
          path: |
            build/check-logs/
            build/chiselsim/
            !build/chiselsim/**/verilated-sources/
            */target/test-reports/
          if-no-files-found: ignore
          retention-days: 14
