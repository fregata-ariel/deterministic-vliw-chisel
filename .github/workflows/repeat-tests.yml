name: Repeat tests

# On demand only (#74): repeats test runs on fresh runners to measure how often they fail
# intermittently. One job per mode (see scripts/repeat-tests.sh); each uploads summary.tsv and the
# logs of every run.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per mode
        type: number
        default: 10
      modes:
        description: >-
          JSON list of modes (hw, crosscheck, hw-then-crosscheck, full, write-reservations,
          forked-parallel, fork-group-2, serial, hw-concurrent)
        type: string
        default: '["hw", "crosscheck", "hw-then-crosscheck", "full"]'
      seed:
        description: VLIW_SIM_SEED per run (empty for the default, run, random or a number)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  repeat:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(inputs.modes) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Install Verilator (ChiselSim backend)
        run: sudo apt-get update && sudo apt-get install -y verilator && verilator --version
      # Compile once, so that the repeated runs measure the tests rather than the compiler.
      - run: scripts/check.sh sbt Test/compile
        env:
          CHECK_LOG_DIR: build/repeat/compile
      - name: Repeat
        run: scripts/repeat-tests.sh "$MODE" "$RUNS"
        timeout-minutes: 285
        env:
          MODE: ${{ matrix.mode }}
          RUNS: ${{ inputs.runs }}
          REPEAT_SEED: ${{ inputs.seed }}
      - name: Upload counts and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repeat-${{ matrix.mode }}-attempt${{ github.run_attempt }}
          path: build/repeat/
          if-no-files-found: ignore
          retention-days: 14
