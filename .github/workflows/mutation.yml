name: Mutation check

# Slow (one full test run per mutant), so it runs on demand and when the mutants change.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/mutants.tsv
      - scripts/mutation-check.sh
      - scripts/mutation-classify.py
      - .github/workflows/mutation.yml

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # One full test run takes about 5.5 minutes on CI, so the mutants are split into shards that run
    # in parallel, each with its own unmutated run first (MUTATION_SHARD in scripts/mutation-check.sh).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Install Verilator (ChiselSim backend)
        run: sudo apt-get update && sudo apt-get install -y verilator && verilator --version
      # Runs the tests once without a mutant first, then each mutant (KILLED, SURVIVED or ERROR, #74).
      - run: scripts/mutation-check.sh
        # Shorter than the job, so that a hang still leaves time to upload the logs.
        timeout-minutes: 110
        env:
          MUTATION_LOG_DIR: build/mutation-logs
          MUTATION_SHARD: ${{ matrix.shard }}/3
      # Always: results.tsv and, per mutant, the sbt log, the JUnit reports, the classification and
      # the ChiselSim logs of failed builds.
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-logs-shard${{ matrix.shard }}-attempt${{ github.run_attempt }}
          path: build/mutation-logs/
          if-no-files-found: ignore
          retention-days: 14
