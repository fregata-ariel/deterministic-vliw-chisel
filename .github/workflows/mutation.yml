name: Mutation check

# Slow (one full test run per mutant), so it runs on demand and when the mutants change.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/mutants.tsv
      - scripts/mutation-check.sh
      - .github/workflows/mutation.yml

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Install Verilator (ChiselSim backend)
        run: sudo apt-get update && sudo apt-get install -y verilator && verilator --version
      - run: scripts/mutation-check.sh
